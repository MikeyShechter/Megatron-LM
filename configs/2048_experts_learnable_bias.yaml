# Part 8 of paper_experiment_plan.md: a learnable selection bias on the standard router, per-token and per-expert,
# with QC (λ=0.1) and with the identity kernel (full STE + post = aux on softmax(z + b), λ=1). The plain aux_loss
# type would not train the bias (it uses the unbiased scores), hence the identity STE.
# Copy of 2048_experts_qc_detach.yaml. Changed: name; LB block; learnable bias.
# 4 runs.
job_details:
  name: experts2048_every2_learnable_bias
  output_dir: /e/data1/mmlaion/shechter1/checkpoints/megatron/

parameters:
  # ── Data ─────────────────────────────────────────────────────────────────────
  data_args_path: ["configs/dclm_baseline_gpt_neox_paths.txt"]
  data_cache_path: ["/e/data1/mmlaion/shechter1/megatron_data_cache/dclm_gpt_neox"]

  split: ["98,1,1"]
  tokenizer_type: ["NullTokenizer"]
  vocab_size: [50277]             # GPT-NeoX tokenizer vocab size; data is already tokenized.
  padded_vocab_size: [50304]
  null_tokenizer_eod_id: [0]      # GPT-NeoX <|endoftext|>
  null_tokenizer_pad_id: [-1]     # no pad token in the pretokenized stream
  save_only_latest: [true]
  save_pre_decay: [true]

  # ── Model ─────────────────────────────────────────────────────────────────────
  num_layers: [12]
  hidden_size: [768]
  num_attention_heads: [6]
  disable_bias_linear: [true]
  seq_length: [1024]
  max_position_embeddings: [1024]
  squared_relu: [true]

  # ── MoE ──────────────────────────────────────────────────────────────────────
  moe_layer_freq: [2]
  ffn_hidden_size: [768]
  num_experts: [2048]
  moe_router_topk: [2]
  moe_grouped_gemm: [true]
  moe_token_dispatcher_type: ["alltoall"]
  moe_ffn_hidden_size: [384]      # same per-expert shape as the 256-expert configuration
  moe_latent_size: [192]
  moe_router_dtype: ["fp32"]
  moe_use_global_lb: [true]
  moe_router_score_function: ["softmax"]

  # ── Load balancing: shared (post, mass normalization, exact margin, EQB quantile, detach) ──
  moe_load_balance_ste_post_activation: [true]     # with a bias: the gradient enters at softmax(z + b)
  moe_load_balance_ste_mass_normalized: [true]
  moe_load_balance_ste_detach_threshold: [true]
  quantile_correction_exact_margin: [true]
  moe_quantile_estimator: ["exact"]

  # ── Learnable selection bias, trained by the LB loss only (router logits detached from it) ──
  moe_learnable_bias_type: ["per_token_bias", "expert_bias"]
  tie_learnable_bias_lr_to_aux_loss_coeff: [true]   # bias LR = lr x λ; Muon/Adam would otherwise cancel λ's scale
  detatch_per_token_bias_input: [true]              # as eblyy2pd; no effect for expert_bias

  # ── Kernel: the same 3 keys in every entry ─────────────────────────────────────
  LIST_KERNEL:
    - moe_router_load_balancing_type: ["quantile_correction_ste"]   # QC at its best λ
      load_balance_ste_type: ["rect"]
      moe_aux_loss_coeff: [0.1]
    - moe_router_load_balancing_type: ["centered_fsq"]              # identity kernel = aux on softmax(z + b), at aux's best λ
      load_balance_ste_type: ["full"]
      moe_aux_loss_coeff: [1.0]

  # ── MaxVio controller: off (rate 0). Sweeps that use it set mode, rate and target. ──
  moe_balance_update_rate: [0.0]
  moe_balance_update_start_iter: [300]

  # ── Optimizer ────────────────────────────────────────────────────────────────
  optimizer: ["muon"]
  muon_scale_mode: ["shape_scaling"]
  muon_nesterov: [true]
  muon_momentum: [0.95]
  lr: [0.02]
  decoupled_lr: [0.002]           # LR of the embedding and output layers
  min_lr: [1.0e-6]
  weight_decay: [0.0]
  clip_grad: [1.0]
  adam_beta1: [0.9]
  adam_beta2: [0.95]

  # ── LR schedule ──────────────────────────────────────────────────────────────
  lr_decay_style: ["WSD"]
  lr_warmup_iters: [0]
  lr_wsd_decay_iters: [1714]      # decay starts at iteration 4286
  lr_wsd_decay_style: ["linear"]

  # ── Batch & iters ─────────────────────────────────────────────────────────────
  micro_batch_size: [32]          # 32 sequences/GPU; one microbatch per optimizer step.
  global_batch_size: [512]        # 512 * 1024 * 2 / 2048 = 512 assignments/expert on average.
  train_iters: [6000]
  bf16: [true]
  seed: [1000]
  deterministic_mode: [true]
  attention_backend: ["unfused"]
  cross_entropy_loss_fusion: [false]

  # ── Parallelism ───────────────────────────────────────────────────────────────
  tensor_model_parallel_size: [1]
  pipeline_model_parallel_size: [1]
  expert_model_parallel_size: [16] # One EP group across all GPUs; 128 local experts/GPU.

  # ── Eval & logging ────────────────────────────────────────────────────────────
  eval_interval: [150]
  eval_iters: [20]
  save_interval: [150]
  log_interval: [10]
  wandb_project: ["megatron-moe"]
  log_timers_to_tensorboard: [true]
