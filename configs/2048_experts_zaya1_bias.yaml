# ZAYA1-8B expert-bias update (arXiv 2605.05365, Eq. 5) in the every2 setting (E=2048, k=2,
# MoE every 2nd layer, Muon, 6000 iters).
# Copy of the int64-counts bias baseline sweep (26-11-07-experts2048_every2_bias_int64_counts,
# job.yaml). Changed: the bias update rule is "zaya1" (an AdamW step on the bias with gradient
# load_share - 1/E; beta1 0.9, beta2 0.95, eps 1e-8, weight decay 0, constant lr), the bias sits on
# the softmax probabilities as in the paper, and the lr is swept. Compare with sign 3e-5 post-softmax
# (tve95kob) and with LongCat = proportional post-softmax (26-10-06 sweeps).
job_details:
  name: experts2048_every2_zaya1_bias
  output_dir: /e/data1/mmlaion/shechter1/checkpoints/megatron/
parameters:
  # --- experiment ---
  moe_router_enable_expert_bias: [true]
  moe_router_bias_update_type: ["zaya1"]
  moe_router_expert_bias_post_softmax: [true]
  moe_router_bias_update_rate: [1.0e-05, 3.0e-05, 1.0e-04]   # AdamW lr of the bias
  moe_router_bias_derivative_rate: [0.0]
  moe_router_bias_adam_beta1: [0.9]
  moe_router_bias_adam_beta2: [0.95]
  moe_router_bias_adam_eps: [1.0e-08]
  moe_router_bias_adam_weight_decay: [0.0]
  # --- setup, unchanged from the baseline sweep ---
  adam_beta1: [0.9]
  adam_beta2: [0.95]
  attention_backend: ["unfused"]
  bf16: [true]
  clip_grad: [1.0]
  cross_entropy_loss_fusion: [false]
  data_args_path: ["configs/dclm_baseline_gpt_neox_paths.txt"]
  data_cache_path: ["/e/data1/mmlaion/shechter1/megatron_data_cache/dclm_gpt_neox"]
  decoupled_lr: [0.002]
  deterministic_mode: [true]
  disable_bias_linear: [true]
  eval_interval: [150]
  eval_iters: [20]
  expert_model_parallel_size: [16]
  ffn_hidden_size: [768]
  global_batch_size: [512]
  hidden_size: [768]
  load_balance_ste_type: ["rect"]
  load_balance_ste_width: [1.0]
  log_interval: [10]
  log_timers_to_tensorboard: [true]
  lr: [0.02]
  lr_decay_style: ["WSD"]
  lr_warmup_iters: [0]
  lr_wsd_decay_iters: [1714]
  lr_wsd_decay_style: ["linear"]
  max_position_embeddings: [1024]
  micro_batch_size: [32]
  min_lr: [1.0e-06]
  moe_aux_loss_coeff: [0.0]
  moe_balance_update_rate: [0.0]         # MaxVio controller off
  moe_balance_update_start_iter: [300]
  moe_ffn_hidden_size: [384]
  moe_grouped_gemm: [true]
  moe_latent_size: [192]
  moe_layer_freq: [2]
  moe_learnable_bias_type: ["none"]
  moe_router_dtype: ["fp32"]
  moe_router_load_balancing_type: ["none"]
  moe_router_score_function: ["softmax"]
  moe_router_topk: [2]
  moe_ste_rect_poistion: ["topk"]
  moe_token_dispatcher_type: ["alltoall"]
  moe_use_global_lb: [true]
  muon_momentum: [0.95]
  muon_nesterov: [true]
  muon_scale_mode: ["shape_scaling"]
  null_tokenizer_eod_id: [0]
  null_tokenizer_pad_id: [-1]
  num_attention_heads: [6]
  num_experts: [2048]
  num_layers: [12]
  optimizer: ["muon"]
  padded_vocab_size: [50304]
  pipeline_model_parallel_size: [1]
  save_interval: [150]
  save_only_latest: [true]
  save_pre_decay: [true]
  seed: [1000]
  seq_length: [1024]
  split: ["98,1,1"]
  squared_relu: [true]
  tensor_model_parallel_size: [1]
  tokenizer_type: ["NullTokenizer"]
  train_iters: [6000]
  vocab_size: [50277]
  wandb_project: ["megatron-moe"]
  weight_decay: [0.0]
