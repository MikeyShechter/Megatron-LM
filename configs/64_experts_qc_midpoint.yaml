# The ½-token fix (quantile_correction_midpoint_coefficient) in the E=64, K=8 setting (user, 2026-11-17): each window
# token's coefficient becomes the load without the token itself plus half a token. Run on the best full-post and the
# best post QC run (results-page rule, among runs balanced like the E=64 baselines, MaxVio end < 1):
# - full post, detached, λ=0.1: 26-11-07-experts64_qc_full_post/001 (3.1782, MaxVio 0.17 / 0.28);
# - post, detached, λ=0.1: 26-11-17-experts64_qc_post_attach/006 (3.1771, MaxVio 0.19 / 0.28).
# The λ=0.01 runs have lower loss but end at MaxVio 2.2–2.5, against 0.1–0.4 for every baseline.
# Copy of 64_experts_qc_post_attach.yaml. Changed: name; the LB block (λ and detach fixed, post margin varied,
# midpoint coefficient on). 2 runs.
job_details:
  name: experts64_qc_midpoint
  output_dir: /e/data1/mmlaion/shechter1/checkpoints/megatron/

parameters:
  # ── Data ─────────────────────────────────────────────────────────────────────
  data_args_path: ["configs/dclm_baseline_gpt_neox_paths.txt"]
  data_cache_path: ["/e/data1/mmlaion/shechter1/megatron_data_cache/dclm_gpt_neox"]

  split: ["98,1,1"]
  tokenizer_type: ["NullTokenizer"]
  vocab_size: [50277]             # GPT-NeoX tokenizer vocab size; data is already tokenized.
  padded_vocab_size: [50304]
  null_tokenizer_eod_id: [0]      # GPT-NeoX <|endoftext|>
  null_tokenizer_pad_id: [-1]     # no pad token in the pretokenized stream
  save_only_latest: [true]
  save_pre_decay: [true]

  task-eval-tasks: ['dclm-core-22']   # as in the E=64 baselines
  task-eval-data-dir: ['/e/project1/laionize/shechter1/core_megatron_datasets']

  # ── Model ─────────────────────────────────────────────────────────────────────
  num_layers: [12]
  hidden_size: [768]
  num_attention_heads: [6]
  disable_bias_linear: [true]
  seq_length: [1024]
  max_position_embeddings: [1024]
  squared_relu: [true]

  # ── MoE: E=64, K=8, MoE in every layer ───────────────────────────────────────
  moe_layer_freq: [1]
  ffn_hidden_size: [3072]
  num_experts: [64]
  moe_router_topk: [8]
  moe_grouped_gemm: [true]
  moe_token_dispatcher_type: ["alltoall"]
  moe_ffn_hidden_size: [384]
  moe_router_dtype: ["fp32"]
  moe_use_global_lb: [true]
  moe_router_score_function: ["sqrtsoftplus"]
  moe_learnable_bias_type: ["none"]

  # ── Load balancing: QC (exact margin, EQB quantile, gradient post at π = s/Σs, mass normalization) ──
  moe_router_load_balancing_type: ["quantile_correction_ste"]
  quantile_correction_exact_margin: [true]
  moe_quantile_estimator: ["exact"]
  moe_load_balance_ste_post_activation: [true]     # post: the gradient enters at π = s/Σs
  moe_load_balance_ste_mass_normalized: [true]     # height T/|W_e|
  quantile_correction_post_margin: [true, false]   # full post (windows on π) and post (windows on the logits)
  moe_load_balance_ste_detach_threshold: [true]
  moe_aux_loss_coeff: [0.1]
  quantile_correction_midpoint_coefficient: [true]  # the ½-token fix

  # ── MaxVio controller: off (rate 0). Sweeps that use it set mode, rate and target. ──
  moe_balance_update_rate: [0.0]
  moe_balance_update_start_iter: [300]

  # ── Optimizer ────────────────────────────────────────────────────────────────
  optimizer: ["muon"]
  muon_scale_mode: ["shape_scaling"]
  muon_nesterov: [true]
  muon_momentum: [0.95]
  lr: [0.02]
  decoupled_lr: [0.002]           # LR of the embedding and output layers
  min_lr: [1.0e-6]
  weight_decay: [0.0]
  clip_grad: [1.0]
  adam_beta1: [0.9]
  adam_beta2: [0.95]

  # ── LR schedule ──────────────────────────────────────────────────────────────
  lr_decay_style: ["WSD"]
  lr_warmup_iters: [0]
  lr_wsd_decay_iters: [1714]      # decay starts at iteration 4286
  lr_wsd_decay_style: ["linear"]

  # ── Batch & iters ─────────────────────────────────────────────────────────────
  micro_batch_size: [32]          # 32 sequences/GPU; one microbatch per optimizer step.
  global_batch_size: [512]        # 512 * 1024 * 8 / 64 = 65,536 assignments/expert on average.
  train_iters: [6000]
  bf16: [true]
  seed: [1000]
  deterministic_mode: [true]
  attention_backend: ["unfused"]
  cross_entropy_loss_fusion: [false]

  # ── Parallelism ───────────────────────────────────────────────────────────────
  tensor_model_parallel_size: [1]
  pipeline_model_parallel_size: [1]
  expert_model_parallel_size: [8]  # 8 local experts/GPU, as in the E=64 baselines.

  # ── Eval & logging ────────────────────────────────────────────────────────────
  eval_interval: [150]
  eval_iters: [20]
  save_interval: [150]
  log_interval: [10]
  wandb_project: ["megatron-moe"]
  log_timers_to_tensorboard: [true]
