# Rerun of the three expert-bias baselines on the results page's Baselines tab, after the fix of
# 2026-11-07: the router's `local_tokens_per_expert` was cast to bf16 by Float16Module, so the
# per-expert token counts were rounded (step 4 at 512-1023) before the bias update. They are now
# int64 as in upstream Megatron main, and the sign update compares integers.
# Settings are those of the original runs, from the 10-06 job.yaml (26-10-06-..._loss_free_softmax_post):
#   DeepSeek, softmax, bias on the logits, rate 0.1     (orig. sxwv1bbi, 26-09-15, val 3.2102)
#   ID balancing, softmax, rate 0.06, K_d 0.06          (orig. 6c549raw, 26-10-04, val 3.2117)
#   DeepSeek, softmax, bias on the probabilities, 3e-5  (orig. 5cxug0e5, 26-10-06, val 3.2166)
job_details:
  name: experts2048_every2_bias_int64_counts
  output_dir: /e/data1/mmlaion/shechter1/checkpoints/megatron/

parameters:
  # ── Experiment: the three baselines ──────────────────────────────────────────
  LIST_BASELINE:
    - moe_router_expert_bias_post_softmax: [false]
      moe_router_bias_update_type: ["sign"]
      moe_router_bias_update_rate: [0.1]
      moe_router_bias_derivative_rate: [0.0]
    - moe_router_expert_bias_post_softmax: [false]
      moe_router_bias_update_type: ["id"]
      moe_router_bias_update_rate: [0.06]
      moe_router_bias_derivative_rate: [0.06]
    - moe_router_expert_bias_post_softmax: [true]
      moe_router_bias_update_type: ["sign"]
      moe_router_bias_update_rate: [3.0e-05]
      moe_router_bias_derivative_rate: [0.0]

  # ── Load balancing: bias only, no loss ───────────────────────────────────────
  moe_router_enable_expert_bias: [true]
  moe_router_load_balancing_type: ["none"]
  moe_aux_loss_coeff: [0.0]
  load_balance_ste_type: ["rect"]
  load_balance_ste_width: [1.0]
  moe_ste_rect_poistion: ["topk"]
  moe_balance_update_rate: [0.0]
  moe_balance_update_start_iter: [300]
  moe_learnable_bias_type: ["none"]

  # ── Data ─────────────────────────────────────────────────────────────────────
  data_args_path: ["configs/dclm_baseline_gpt_neox_paths.txt"]
  data_cache_path: ["/e/data1/mmlaion/shechter1/megatron_data_cache/dclm_gpt_neox"]
  split: ["98,1,1"]
  tokenizer_type: ["NullTokenizer"]
  vocab_size: [50277]
  padded_vocab_size: [50304]
  null_tokenizer_eod_id: [0]
  null_tokenizer_pad_id: [-1]
  save_only_latest: [true]
  save_pre_decay: [true]

  # ── Model ─────────────────────────────────────────────────────────────────────
  num_layers: [12]
  hidden_size: [768]
  num_attention_heads: [6]
  disable_bias_linear: [true]
  seq_length: [1024]
  max_position_embeddings: [1024]
  squared_relu: [true]

  # ── MoE ──────────────────────────────────────────────────────────────────────
  moe_layer_freq: [2]
  ffn_hidden_size: [768]
  num_experts: [2048]
  moe_router_topk: [2]
  moe_grouped_gemm: [true]
  moe_token_dispatcher_type: ["alltoall"]
  moe_ffn_hidden_size: [384]
  moe_latent_size: [192]
  moe_router_dtype: ["fp32"]
  moe_use_global_lb: [true]
  moe_router_score_function: ["softmax"]

  # ── Optimizer ────────────────────────────────────────────────────────────────
  optimizer: ["muon"]
  muon_scale_mode: ["shape_scaling"]
  muon_nesterov: [true]
  muon_momentum: [0.95]
  lr: [0.02]
  decoupled_lr: [0.002]
  min_lr: [1.0e-6]
  weight_decay: [0.0]
  clip_grad: [1.0]
  adam_beta1: [0.9]
  adam_beta2: [0.95]

  # ── LR schedule ──────────────────────────────────────────────────────────────
  lr_decay_style: ["WSD"]
  lr_warmup_iters: [0]
  lr_wsd_decay_iters: [1714]
  lr_wsd_decay_style: ["linear"]

  # ── Batch & iters ─────────────────────────────────────────────────────────────
  micro_batch_size: [32]
  global_batch_size: [512]
  train_iters: [6000]
  bf16: [true]
  seed: [1000]
  deterministic_mode: [true]
  attention_backend: ["unfused"]
  cross_entropy_loss_fusion: [false]

  # ── Parallelism ───────────────────────────────────────────────────────────────
  tensor_model_parallel_size: [1]
  pipeline_model_parallel_size: [1]
  expert_model_parallel_size: [16]

  # ── Eval & logging ────────────────────────────────────────────────────────────
  eval_interval: [150]
  eval_iters: [20]
  save_interval: [150]
  log_interval: [10]
  wandb_project: ["megatron-moe"]
  log_timers_to_tensorboard: [true]
