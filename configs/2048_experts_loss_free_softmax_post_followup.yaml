# Follow-up to the 4-run pilot 26-10-06-experts2048_every2_loss_free_softmax_post (sign u in {3e-5, 3e-4},
# proportional u in {1e-7, 1e-6}). At step ~1050 the pilot's sign 3e-5 and proportional 1e-7 balanced (MaxVio ~7, ~4)
# while sign 3e-4 and proportional 1e-6 were too large, so this adds rates around and below the working ones.
# Loss-Free Balancing (arXiv 2408.15664) with a softmax gate: the expert bias is added to the softmax probabilities
# (moe_router_expert_bias_post_softmax), e = mean load - load in token counts of the global batch.
# Copy of 2048_experts_loss_free_softmax_post.yaml. Changed: name; header; update rates.
# 3 runs: sign u in {1e-5, 1e-4}, proportional u = 1e-8.
job_details:
  name: experts2048_every2_loss_free_softmax_post_followup
  output_dir: /e/data1/mmlaion/shechter1/checkpoints/megatron/

parameters:
  # ── Data ─────────────────────────────────────────────────────────────────────
  data_args_path: ["configs/dclm_baseline_gpt_neox_paths.txt"]
  data_cache_path: ["/e/data1/mmlaion/shechter1/megatron_data_cache/dclm_gpt_neox"]

  split: ["98,1,1"]
  tokenizer_type: ["NullTokenizer"]
  vocab_size: [50277]             # GPT-NeoX tokenizer vocab size; data is already tokenized.
  padded_vocab_size: [50304]
  null_tokenizer_eod_id: [0]      # GPT-NeoX <|endoftext|>
  null_tokenizer_pad_id: [-1]     # no pad token in the pretokenized stream
  save_only_latest: [true]
  save_pre_decay: [true]

  # ── Model ─────────────────────────────────────────────────────────────────────
  num_layers: [12]
  hidden_size: [768]
  num_attention_heads: [6]
  disable_bias_linear: [true]
  seq_length: [1024]
  max_position_embeddings: [1024]
  squared_relu: [true]

  # ── MoE ──────────────────────────────────────────────────────────────────────
  moe_layer_freq: [2]
  ffn_hidden_size: [768]
  num_experts: [2048]
  moe_router_topk: [2]
  moe_grouped_gemm: [true]
  moe_token_dispatcher_type: ["alltoall"]
  moe_ffn_hidden_size: [384]      # same per-expert shape as the 256-expert configuration
  moe_latent_size: [192]
  moe_router_dtype: ["fp32"]
  moe_use_global_lb: [true]
  moe_router_score_function: ["softmax"]
  moe_learnable_bias_type: ["none"]

  # ── Load balancing: Loss-Free expert bias on the softmax probabilities (no LB loss; STE keys unused with type none) ──
  moe_router_load_balancing_type: ["none"]
  moe_aux_loss_coeff: [0.0]
  load_balance_ste_type: ["rect"]
  load_balance_ste_width: [1.0]
  moe_ste_rect_poistion: ["topk"]
  moe_router_enable_expert_bias: [true]
  moe_router_expert_bias_post_softmax: [true]

  # ── Update rule and rate u (bias in probability units) ──
  LIST_UPDATE:
    - moe_router_bias_update_type: ["sign"]          # step u per expert per step
      moe_router_bias_update_rate: [1.0e-5, 1.0e-4]
    - moe_router_bias_update_type: ["proportional"]  # step u*e; e = +512 for a dead expert
      moe_router_bias_update_rate: [1.0e-8]

  # ── MaxVio controller: off (rate 0). Sweeps that use it set mode, rate and target. ──
  moe_balance_update_rate: [0.0]
  moe_balance_update_start_iter: [300]

  # ── Optimizer ────────────────────────────────────────────────────────────────
  optimizer: ["muon"]
  muon_scale_mode: ["shape_scaling"]
  muon_nesterov: [true]
  muon_momentum: [0.95]
  lr: [0.02]
  decoupled_lr: [0.002]           # LR of the embedding and output layers
  min_lr: [1.0e-6]
  weight_decay: [0.0]
  clip_grad: [1.0]
  adam_beta1: [0.9]
  adam_beta2: [0.95]

  # ── LR schedule ──────────────────────────────────────────────────────────────
  lr_decay_style: ["WSD"]
  lr_warmup_iters: [0]
  lr_wsd_decay_iters: [1714]      # decay starts at iteration 4286
  lr_wsd_decay_style: ["linear"]

  # ── Batch & iters ─────────────────────────────────────────────────────────────
  micro_batch_size: [32]          # 32 sequences/GPU; one microbatch per optimizer step.
  global_batch_size: [512]        # 512 * 1024 * 2 / 2048 = 512 assignments/expert on average.
  train_iters: [6000]
  bf16: [true]
  seed: [1000]
  deterministic_mode: [true]
  attention_backend: ["unfused"]
  cross_entropy_loss_fusion: [false]

  # ── Parallelism ───────────────────────────────────────────────────────────────
  tensor_model_parallel_size: [1]
  pipeline_model_parallel_size: [1]
  expert_model_parallel_size: [16] # One EP group across all GPUs; 128 local experts/GPU.

  # ── Eval & logging ────────────────────────────────────────────────────────────
  eval_interval: [150]
  eval_iters: [20]
  save_interval: [150]
  log_interval: [10]
  wandb_project: ["megatron-moe"]
  log_timers_to_tensorboard: [true]
