# The E=768, K=3 setting (user, 2026-11-18): a middle point between E=64/K=8 and E=2048/K=2, the routing of ID Balancing
# (arXiv 2609.39137, Top-3 of 768) on our 12-layer model. Changed from the E=2048 bias-baseline config (26-11-07 int64
# counts): 768 experts, top-3, MoE in every layer, sigmoid router, batched Newton-Schulz for Muon (muon_ns_batch_size,
# copied from upstream Megatron-LM's LayerShardedMuon); EP 16 = 48 local experts. Latent 192 and expert FFN 384 as at
# E=2048.
# Methods, each at 3 values 10x apart around its best value in the other settings (E=2048 sigmoid runs where they
# differ from E=64):
# - aux loss: λ 0.1 / 1 / 10 (E=2048 best λ=1; E=64 0.1)
# - DeepSeek (sign update, bias on the sigmoid scores): rate 1e-4 / 1e-3 / 1e-2 (E=2048 sigmoid best 1e-3)
# - ID Balancing, K_i = K_d: 6e-4 / 6e-3 / 6e-2 (best 6e-3 at both)
# - QC post (mass norm., exact margin, EQB, detach): λ 0.01 / 0.1 / 1 (best 0.1)
# - QB with EQB (no parameter)
# 13 runs.
job_details:
  name: experts768_top3_baselines_qc
  output_dir: /e/data1/mmlaion/shechter1/checkpoints/megatron/
parameters:
  # --- experiment: one sub-grid per method; every sub-grid lists the same keys in the same order ---
  LIST_METHOD:
    - moe_router_load_balancing_type: ["aux_loss"]   # aux loss
      moe_aux_loss_coeff: [0.1, 1.0, 10.0]
      moe_router_enable_expert_bias: [false]
      moe_router_bias_update_type: ["sign"]
      moe_router_bias_update_rate: [0.001]
      moe_router_bias_derivative_rate: [0.0]
      moe_quantile_estimator: ["legacy"]
      quantile_correction_exact_margin: [false]
      moe_load_balance_ste_post_activation: [false]
      moe_load_balance_ste_mass_normalized: [false]
      moe_load_balance_ste_detach_threshold: [false]
    - moe_router_load_balancing_type: ["none"]   # DeepSeek: sign update of the bias on the sigmoid scores
      moe_aux_loss_coeff: [0.0]
      moe_router_enable_expert_bias: [true]
      moe_router_bias_update_type: ["sign"]
      moe_router_bias_update_rate: [0.0001, 0.001, 0.01]
      moe_router_bias_derivative_rate: [0.0]
      moe_quantile_estimator: ["legacy"]
      quantile_correction_exact_margin: [false]
      moe_load_balance_ste_post_activation: [false]
      moe_load_balance_ste_mass_normalized: [false]
      moe_load_balance_ste_detach_threshold: [false]
    - moe_router_load_balancing_type: ["none"]   # ID Balancing, K_i = K_d = 0.0006
      moe_aux_loss_coeff: [0.0]
      moe_router_enable_expert_bias: [true]
      moe_router_bias_update_type: ["id"]
      moe_router_bias_update_rate: [0.0006]
      moe_router_bias_derivative_rate: [0.0006]
      moe_quantile_estimator: ["legacy"]
      quantile_correction_exact_margin: [false]
      moe_load_balance_ste_post_activation: [false]
      moe_load_balance_ste_mass_normalized: [false]
      moe_load_balance_ste_detach_threshold: [false]
    - moe_router_load_balancing_type: ["none"]   # ID Balancing, K_i = K_d = 0.006
      moe_aux_loss_coeff: [0.0]
      moe_router_enable_expert_bias: [true]
      moe_router_bias_update_type: ["id"]
      moe_router_bias_update_rate: [0.006]
      moe_router_bias_derivative_rate: [0.006]
      moe_quantile_estimator: ["legacy"]
      quantile_correction_exact_margin: [false]
      moe_load_balance_ste_post_activation: [false]
      moe_load_balance_ste_mass_normalized: [false]
      moe_load_balance_ste_detach_threshold: [false]
    - moe_router_load_balancing_type: ["none"]   # ID Balancing, K_i = K_d = 0.06
      moe_aux_loss_coeff: [0.0]
      moe_router_enable_expert_bias: [true]
      moe_router_bias_update_type: ["id"]
      moe_router_bias_update_rate: [0.06]
      moe_router_bias_derivative_rate: [0.06]
      moe_quantile_estimator: ["legacy"]
      quantile_correction_exact_margin: [false]
      moe_load_balance_ste_post_activation: [false]
      moe_load_balance_ste_mass_normalized: [false]
      moe_load_balance_ste_detach_threshold: [false]
    - moe_router_load_balancing_type: ["quantile_balancing"]   # QB with EQB
      moe_aux_loss_coeff: [0.0]
      moe_router_enable_expert_bias: [false]
      moe_router_bias_update_type: ["sign"]
      moe_router_bias_update_rate: [0.001]
      moe_router_bias_derivative_rate: [0.0]
      moe_quantile_estimator: ["exact"]
      quantile_correction_exact_margin: [false]
      moe_load_balance_ste_post_activation: [false]
      moe_load_balance_ste_mass_normalized: [false]
      moe_load_balance_ste_detach_threshold: [false]
    - moe_router_load_balancing_type: ["quantile_correction_ste"]   # QC post: windows on the logits, gradient at π
      moe_aux_loss_coeff: [0.01, 0.1, 1.0]
      moe_router_enable_expert_bias: [false]
      moe_router_bias_update_type: ["sign"]
      moe_router_bias_update_rate: [0.001]
      moe_router_bias_derivative_rate: [0.0]
      moe_quantile_estimator: ["exact"]
      quantile_correction_exact_margin: [true]
      moe_load_balance_ste_post_activation: [true]
      moe_load_balance_ste_mass_normalized: [true]
      moe_load_balance_ste_detach_threshold: [true]
  # --- the E=768, K=3 setting ---
  num_experts: [768]
  moe_router_topk: [3]
  moe_layer_freq: [1]
  moe_router_score_function: ["sigmoid"]
  muon_ns_batch_size: [1024]          # one batched Newton-Schulz per same-shape bucket (576 expert matrices per GPU)
  # --- setup, unchanged from the E=2048 baseline config ---
  adam_beta1: [0.9]
  adam_beta2: [0.95]
  attention_backend: ["unfused"]
  bf16: [true]
  clip_grad: [1.0]
  cross_entropy_loss_fusion: [false]
  data_args_path: ["configs/dclm_baseline_gpt_neox_paths.txt"]
  data_cache_path: ["/e/data1/mmlaion/shechter1/megatron_data_cache/dclm_gpt_neox"]
  decoupled_lr: [0.002]
  deterministic_mode: [true]
  disable_bias_linear: [true]
  eval_interval: [150]
  eval_iters: [20]
  expert_model_parallel_size: [16]
  ffn_hidden_size: [768]
  global_batch_size: [512]
  hidden_size: [768]
  load_balance_ste_type: ["rect"]
  load_balance_ste_width: [1.0]
  log_interval: [10]
  log_timers_to_tensorboard: [true]
  lr: [0.02]
  lr_decay_style: ["WSD"]
  lr_warmup_iters: [0]
  lr_wsd_decay_iters: [1714]
  lr_wsd_decay_style: ["linear"]
  max_position_embeddings: [1024]
  micro_batch_size: [32]
  min_lr: [1.0e-06]
  moe_balance_update_rate: [0.0]         # MaxVio controller off
  moe_balance_update_start_iter: [300]
  moe_ffn_hidden_size: [384]
  moe_grouped_gemm: [true]
  moe_latent_size: [192]
  moe_learnable_bias_type: ["none"]
  moe_router_dtype: ["fp32"]
  moe_ste_rect_poistion: ["topk"]
  moe_token_dispatcher_type: ["alltoall"]
  moe_use_global_lb: [true]
  muon_momentum: [0.95]
  muon_nesterov: [true]
  muon_scale_mode: ["shape_scaling"]
  null_tokenizer_eod_id: [0]
  null_tokenizer_pad_id: [-1]
  num_attention_heads: [6]
  num_layers: [12]
  optimizer: ["muon"]
  padded_vocab_size: [50304]
  pipeline_model_parallel_size: [1]
  save_interval: [150]
  save_only_latest: [true]
  save_pre_decay: [true]
  seed: [1000]
  seq_length: [1024]
  split: ["98,1,1"]
  squared_relu: [true]
  tensor_model_parallel_size: [1]
  tokenizer_type: ["NullTokenizer"]
  train_iters: [6000]
  vocab_size: [50277]
  wandb_project: ["megatron-moe"]
  weight_decay: [0.0]
